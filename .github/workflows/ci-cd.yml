name: MediSense AI CI/CD

# Unit 5: DevOps — automated testing, then container build & push, on every
# push/PR to main. Building only happens after tests pass (needs: test),
# and pushing to Docker Hub only happens on main (not on pull requests),
# so a PR from a fork can run the full test suite without needing registry
# credentials.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run backend test suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run pytest
        working-directory: backend
        env:
          MEDISENSE_FORCE_MOCK_DB: "1"
        run: pytest tests/ -v

  build-and-push:
    name: Build & push Docker images
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/medisense-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/medisense-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/medisense-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/medisense-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
